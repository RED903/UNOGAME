<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="darkreader-lock" content="true"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🧩 루미큐브 (Rummikub) — 실시간 보드게임</title>
  <meta name="description" content="숫자와 색상을 조합하여 손패의 타일을 가장 먼저 털어내는 타일 전략의 정점, 루미큐브입니다."/>
  <link rel="stylesheet" href="css/rummikub.css"/>
</head>
<body>

  <div class="rummi-root">

    <!-- ── 헤더 ── -->
    <header class="rummi-header">
      <div class="room-badge" id="display-room-code">ROOM: ------</div>
      <div class="turn-indicator" id="turn-indicator">
        <span id="turn-avatar">🧩</span>
        <span id="turn-text">로딩 중...</span>
      </div>
      <button class="btn-leave" id="btn-leave">🚪 나가기</button>
    </header>

    <!-- ── 참가자 현황 바 ── -->
    <section class="players-status-bar" id="players-status-bar">
      <!-- 플레이어별 잔여 타일 수 배지 -->
    </section>

    <!-- ── 공용 보드판 (Meld Board) ── -->
    <main class="board-zone" id="board-zone">
      <div class="board-empty-hint" id="board-empty-hint">
        <div style="font-size:2rem;">🧩</div>
        <div>아직 보드판에 등록된 타일 세트가 없습니다.</div>
        <div style="font-size:0.8rem; opacity:0.7;">(최초 등록: 타일 숫자 합계 30점 이상 필요)</div>
      </div>
    </main>

    <!-- ── 내 타일 랙 및 조작 패널 ── -->
    <section class="my-rack-container">
      
      <!-- 컨트롤 바 -->
      <div class="rack-controls-row">
        <div class="rack-btn-group">
          <button class="btn-rack-util" id="btn-sort-num" title="숫자별 정렬">
            🔢 숫자 정렬 (777)
          </button>
          <button class="btn-rack-util" id="btn-sort-color" title="색상별 정렬">
            🎨 색상 정렬 (123)
          </button>
          <button class="btn-rack-util" id="btn-clear-selection">
            ✖ 선택 해제
          </button>
        </div>

        <div class="rack-btn-group">
          <button class="btn-main-action meld" id="btn-meld-tiles" disabled>
            ✨ 세트 내려놓기 (<span id="selected-count">0</span>)
          </button>
          <button class="btn-main-action draw" id="btn-draw-tile" disabled>
            📥 타일 1장 뽑기 (턴 종료)
          </button>
        </div>
      </div>

      <!-- 내 타일 랙 -->
      <div class="my-tiles-rack" id="my-tiles-rack">
        <!-- 내 손패 타일들이 렌더링됨 -->
      </div>
    </section>

  </div>

  <!-- ── 게임 승리 결과 모달 ── -->
  <div class="modal-overlay" id="result-modal">
    <div class="modal-box">
      <div style="font-size:3rem;">🎉</div>
      <h2 style="font-size:1.8rem; color:var(--gold); margin:8px 0;" id="winner-title">루미큐브 달성!</h2>
      <p id="winner-desc" style="font-size:0.95rem; color:rgba(240,240,255,0.8); line-height:1.6; margin-bottom:20px;">
        손패의 타일을 모두 털어내고 최종 승리했습니다!
      </p>
      <div style="display:flex; gap:10px;">
        <button class="btn-main-action draw" id="btn-modal-lobby" style="flex:1; background:rgba(255,255,255,0.12);">
          🏠 대기실로
        </button>
        <button class="btn-main-action meld" id="btn-modal-restart" style="flex:1;">
          🔄 다시 하기
        </button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <!-- Firebase 및 게임 스크립트 연결 -->
  <script type="module" src="js/rummikub.js"></script>
</body>
</html>
