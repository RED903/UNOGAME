<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="darkreader-lock" content="true"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🤠 인디언 포커 (Indian Poker) — 실시간 심리 베팅</title>
  <meta name="description" content="내 이마의 카드는 보이지 않는다! 상대방 카드와 눈빛을 읽어 승부하는 심리 서바이벌 인디언 포커입니다."/>
  <link rel="stylesheet" href="css/indian.css"/>
</head>
<body>

  <div class="indian-root">

    <!-- ── 상단 헤더 ── -->
    <header class="indian-header">
      <div class="room-badge" id="display-room-code" title="클릭하여 방 코드 숨기기/보기" style="cursor:pointer;">ROOM: ------</div>
      <div class="round-status-badge" id="round-status-badge">
        <span id="turn-avatar">🤠</span>
        <span id="turn-text">로딩 중...</span>
      </div>
      <button class="btn-leave" id="btn-leave">🚪 나가기</button>
    </header>

    <!-- ── 메인 포커 테이블 ── -->
    <main class="poker-table-zone">

      <!-- 1. 상대방 플레이어들의 이마 카드 -->
      <section class="opponents-row" id="opponents-row">
        <!-- 상대방 좌석 렌더링 -->
      </section>

      <!-- 2. 중앙 팟(POT) & 라운드 액션 티커 -->
      <section class="table-center-pot">
        <div class="pot-compact-badge">
          <span class="pot-title-label">TOTAL POT</span>
          <span class="pot-amount-val" id="pot-amount"><span class="chip-coin-icon"></span> 0</span>
        </div>
        <div class="call-needed-badge" id="current-bet-info" style="display:none;"></div>
        <div class="action-log-ticker" id="action-log-ticker">라운드를 시작합니다.</div>
      </section>

      <!-- 3. 내 플레이어 영역 (내 이마 카드 & 베팅 컨트롤) -->
      <section class="my-player-zone">
        <div class="player-seat" id="my-seat">
          <div class="forehead-card secret" id="my-forehead-card">
            <span class="card-question" id="my-card-value">?</span>
          </div>
          <div class="player-seat-info">
            <span id="my-avatar">🦊</span>
            <span id="my-name">나</span>
            <span class="chips-badge" id="my-chips"><span class="chip-coin-icon"></span> 30</span>
            <span class="badge-me">나</span>
          </div>
        </div>

        <!-- 베팅 조작 버튼 바 (간결하고 직관적인 포커 버튼) -->
        <div class="betting-controls-bar">
          <button class="btn-action fold" id="btn-fold" disabled>
            다이
          </button>
          <button class="btn-action check" id="btn-check" disabled>
            체크
          </button>
          <button class="btn-action call" id="btn-call" disabled>
            콜 (0)
          </button>
          <button class="btn-action raise" id="btn-raise" disabled>
            레이즈 (+2)
          </button>
        </div>
      </section>

    </main>

  </div>

  <!-- ── 쇼다운 & 라운드 결과 모달 ── -->
  <div class="modal-overlay" id="round-result-modal">
    <div class="modal-box">
      <div style="font-size:2.4rem;" id="modal-result-icon">🏆</div>
      <h3 style="font-size:1.4rem; color:var(--gold); margin:6px 0;" id="modal-result-title">라운드 종료</h3>
      <p id="modal-result-desc" style="font-size:0.92rem; color:rgba(240,240,255,0.85); line-height:1.6; margin-bottom:16px;">
        <!-- 라운드 결과 설명 -->
      </p>
      <button class="btn-action raise" id="btn-next-round" style="width:100%;" disabled>
        다음 라운드 준비 중...
      </button>
    </div>
  </div>

  <!-- ── 최종 게임 종료 모달 ── -->
  <div class="modal-overlay" id="final-game-modal">
    <div class="modal-box">
      <div style="font-size:2.6rem;">👑</div>
      <h2 style="font-size:1.5rem; color:var(--gold); margin:8px 0;" id="final-winner-title">최종 우승자 탄생!</h2>
      <p id="final-desc" style="font-size:0.92rem; color:rgba(240,240,255,0.7); line-height:1.6; margin-bottom:18px;">
        <!-- 최종 순위 정보 -->
      </p>
      <div style="display:flex; gap:10px;">
        <button class="btn-action fold" id="btn-final-lobby" style="flex:1;">
          🏠 대기실로
        </button>
        <button class="btn-action raise" id="btn-final-restart" style="flex:1;">
          🔄 다시 하기
        </button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <!-- 게임 스크립트 연결 (file:/// 로컬 및 웹 듀얼 지원) -->
  <script>
    if (window.location.protocol === 'file:' || new URLSearchParams(window.location.search).get('local') === 'true') {
      document.write('<script src="js/bundles/indian.bundle.js"><\/script>');
    } else {
      const s = document.createElement('script');
      s.type = 'module';
      s.src = 'js/indian.js';
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
